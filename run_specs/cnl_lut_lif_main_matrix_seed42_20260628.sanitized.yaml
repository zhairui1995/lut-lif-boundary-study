claim_boundary:
  can_claim:
    - setting_specific_cifar100_t4_repair
    - current_mse_improves_under_fixed_protocol
    - main_matrix_rejects_broad_superiority
  cannot_claim:
    - hardware_latency_energy_or_sram_benefit
    - broad_architecture_generalization
    - seed_stability_beyond_seed42
    - bit_width_robustness

