schema_version: 1
run_id: cnl_lut_lif_c100_t1_bit8_boundary_seed42_20260629
status: completed_primary_diagnostic_go_secondary_cnl_no_go
owner: anonymous_authors
created_at: 2026-06-29
completed_at: 2026-06-29

question:
  hypothesis: >-
    The severe CIFAR-100 T=1 all-LIF replacement drop in the completed 6-bit
    CNL-LUT-LIF matrix is primarily sensitive to fixed 6-bit state/input
    transition precision or state-range discretization. Raising only the
    transition precision to 8 bits under the same checkpoint, dataset,
    calibration budget, targets, and validation protocol will materially reduce
    the paired accuracy drop.
  strongest_alternative_explanation: >-
    The failure reflects a deeper recurrent-dynamics, current-lookup support,
    reset, or spike-timing mismatch that persists even when transition
    precision is raised to 8 bits.
  claim_id_unlocked: CNL-LUT-LIF-H3-C100-T1-BITWIDTH-BOUNDARY-DIAGNOSTIC

environment:
  host: anonymous_gpu_node
  repo_root: ${REPO_ROOT}
  code_sync: anonymous_public_sync_branch
  git_commit_or_snapshot: 959782f
  conda_environment: sdr_or_equivalent
  python: ${PYTHON}
  gpu_count: 1

protocol:
  family: cifar100
  num_classes: 100
  time_step: 1
  checkpoint: ${CHECKPOINT_DIR}/qkformer_cifar100_t1_seed42_model_best.pth.tar
  data_dir: ${DATA_DIR}
  seed: 42
  calibration_batches: 128
  evaluation_samples: full_validation_10000
  batch_size: 32
  workers: 4
  state_bits: 8
  input_bits: 8
  range_margin: 0.05
  targets: all_discovered_MultiStepLIFNode_targets
  no_search:
    - no_seed_sweep
    - no_checkpoint_sweep
    - no_dataset_sweep
    - no_time_step_sweep
    - no_bit_width_sweep
    - no_calibration_budget_sweep
    - no_learning_rate_sweep
    - no_validation_checkpoint_selection

